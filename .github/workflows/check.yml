name: Baseline verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the reference dependencies
        run: python -m pip install -r requirements-repro.txt
      - name: Install the package
        run: python -m pip install --no-deps -e .
      - name: Confirm the environment has no SciPy
        run: python -c "import importlib.util; assert importlib.util.find_spec('scipy') is None"
      - name: Numerical, failure-path, and reproducible build tests
        run: python -m pytest -q
      - name: Check artifact provenance and fresh numerical verification
        run: python scripts/build_model_viewer.py --check
